---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  # Sets git's initial branch name for the repository actions/checkout initializes; without it, git prints a
  # hint about the unset default ("...which will suppress this warning").
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # A deprecated Node.js API fails the process that calls it.
  NODE_OPTIONS: --throw-deprecation

jobs:
  dependencies:
    name: Dependencies (npm audit, registry signatures, newest releases)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          allowed-endpoints: >-
            api.adoptium.net:443 api.github.com:443 files.pythonhosted.org:443 github.com:443 nodejs.org:443
            objects.githubusercontent.com:443 pypi.org:443 raw.githubusercontent.com:443 registry.npmjs.org:443
            release-assets.githubusercontent.com:443 tuf-repo-cdn.sigstore.dev:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The npm of tools/releases.txt, verified against its pinned SHA-256 (rather than
      # `npm install --global npm@...`, an install outside any lockfile).
      - name: Install npm (tools/releases.txt)
        run: script/install_tools.sh "${RUNNER_TEMP}/npm" npm
      - name: Install the dependencies (package-lock.json)
        run: npm ci
      - name: The lockfile is current and resolves every package from registry.npmjs.org
        run: script/check_lockfile.sh
      - name: No known vulnerability of any severity
        run: npm audit --audit-level=low
      - name: Registry signatures and provenance attestations
        run: npm audit signatures
      - name: Every npm package is on its newest release
        run: npm outdated
      # Python is needed to check whether the pinned linters have wheels for a newer Python (below).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Every pinned tool and runtime is on its newest release
        run: script/outdated_tools.sh
    timeout-minutes: 15

  # Requires the repository's dependency graph (Settings > Code security).
  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency review
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      # The action also looks up the OpenSSF Scorecard of each changed dependency (deps.dev, Scorecard API).
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          allowed-endpoints: >-
            api.deps.dev:443 api.github.com:443 api.securityscorecards.dev:443 github.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Any known vulnerability, of any severity, in a dependency that the pull request adds or changes (npm,
      # GitHub Actions and the pip-installed linters) fails the job.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: never
          fail-on-scopes: development, runtime, unknown
          fail-on-severity: low
    timeout-minutes: 10

  gitleaks:
    name: Secret scanning (gitleaks)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          allowed-endpoints: >-
            github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (tools/releases.txt)
        run: script/install_tools.sh "${RUNNER_TEMP}/tools" gitleaks
      - name: Scan the full history for secrets
        run: gitleaks git --redact --verbose --exit-code 1 .
    timeout-minutes: 10

  warning-gate:
    if: ${{ !cancelled() }}
    name: Warning gate (Security)
    needs: [dependencies, dependency-review, gitleaks]
    permissions:
      actions: read # reads the logs of the other jobs of this run
      contents: read
    runs-on: ubuntu-26.04
    steps:
      # The job logs are served from Azure blob storage, to which the logs API redirects.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443 api.github.com:443 github.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GATE_JOB_NAME: Warning gate (Security)
          GH_TOKEN: ${{ github.token }}
        name: Fail on any warning or deprecation in the logs of this run
        run: script/warning_gate.sh
    timeout-minutes: 10

name: Security

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # New advisories and new releases appear without a change to the repository.
  schedule:
    - cron: 17 4 * * 1
  workflow_dispatch: {}

permissions: {}
