---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  # Sets git's initial branch name for the repository actions/checkout initializes; without it, git prints a
  # hint about the unset default ("...which will suppress this warning").
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  actionlint:
    name: actionlint (with ShellCheck on every run block)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          allowed-endpoints: >-
            api.github.com:443 files.pythonhosted.org:443 github.com:443 objects.githubusercontent.com:443
            pypi.org:443 raw.githubusercontent.com:443 release-assets.githubusercontent.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install ShellCheck, typos, yamllint and zizmor (tools/requirements.txt, pinned by hash)
        run: >-
          python -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary :all:
          -r tools/requirements.txt
      - name: Install actionlint, editorconfig-checker and shfmt (tools/releases.txt, pinned by SHA-256)
        run: script/install_tools.sh "${RUNNER_TEMP}/tools" actionlint editorconfig-checker shfmt
      # actionlint runs ShellCheck (of tools/requirements.txt) on every run block, with every optional check.
      - env:
          SHELLCHECK_OPTS: --enable=all --severity=style
        name: actionlint
        run: actionlint -color
    timeout-minutes: 10

  warning-gate:
    if: ${{ !cancelled() }}
    name: Warning gate (Workflow lint)
    needs: [actionlint, zizmor]
    permissions:
      actions: read # reads the logs of the other jobs of this run
      contents: read
    runs-on: ubuntu-26.04
    steps:
      # The job logs are served from Azure blob storage, to which the logs API redirects.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443 api.github.com:443 github.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GATE_JOB_NAME: Warning gate (Workflow lint)
          GH_TOKEN: ${{ github.token }}
        name: Fail on any warning or deprecation in the logs of this run
        run: script/warning_gate.sh
    timeout-minutes: 10

  zizmor:
    name: zizmor (pedantic persona)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          allowed-endpoints: >-
            api.github.com:443 files.pythonhosted.org:443 github.com:443 objects.githubusercontent.com:443
            pypi.org:443 raw.githubusercontent.com:443 release-assets.githubusercontent.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install ShellCheck, typos, yamllint and zizmor (tools/requirements.txt, pinned by hash)
        run: >-
          python -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary :all:
          -r tools/requirements.txt
      - name: Install actionlint, editorconfig-checker and shfmt (tools/releases.txt, pinned by SHA-256)
        run: script/install_tools.sh "${RUNNER_TEMP}/tools" actionlint editorconfig-checker shfmt
      # Every audit and every finding of any severity and confidence (the default thresholds), including the online
      # audits (known-vulnerable and impostor action commits, stale action refs).
      - env:
          GH_TOKEN: ${{ github.token }}
        name: zizmor
        run: zizmor --persona pedantic --format plain .
    timeout-minutes: 10

name: Workflow lint

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}
