---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  # Sets git's initial branch name for the repository actions/checkout initializes; without it, git prints a
  # hint about the unset default ("...which will suppress this warning").
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  analysis:
    name: Scorecard analysis
    permissions:
      actions: read # Scorecard reads the workflow runs
      contents: read
      security-events: write # upload the SARIF results to code scanning
    runs-on: ubuntu-26.04
    steps:
      # scorecard-action is a container action, so containers stay enabled in this job.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          allowed-endpoints: >-
            api.deps.dev:443 api.github.com:443 api.osv.dev:443 api.scorecard.dev:443
            api.securityscorecards.dev:443 github.com:443 objects.githubusercontent.com:443
            oss-fuzz-build-logs.storage.googleapis.com:443 uploads.github.com:443 www.bestpractices.dev:443
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          # Publishing to the OpenSSF REST API (for the public badge) is off; the results land in the
          # repository's code-scanning dashboard through the SARIF upload below.
          publish_results: false
          results_file: results.sarif
          results_format: sarif
      - name: Give repository-level findings a valid location
        run: script/locate_sarif.sh results.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
    timeout-minutes: 15

  warning-gate:
    if: ${{ !cancelled() }}
    name: Warning gate (Scorecard)
    needs: [analysis]
    permissions:
      actions: read # reads the logs of the other jobs of this run
      contents: read
    runs-on: ubuntu-26.04
    steps:
      # The job logs are served from Azure blob storage, to which the logs API redirects.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443 api.github.com:443 github.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GATE_JOB_NAME: Warning gate (Scorecard)
          GH_TOKEN: ${{ github.token }}
        name: Fail on any warning or deprecation in the logs of this run
        run: script/warning_gate.sh
    timeout-minutes: 10

name: OpenSSF Scorecard

"on":
  branch_protection_rule: {}
  push:
    branches: [main]
  schedule:
    - cron: 30 6 * * 1
  workflow_dispatch: {}

permissions: {}
