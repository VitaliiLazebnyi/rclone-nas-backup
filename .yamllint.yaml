---
# yamllint configuration. CI runs `yamllint --strict`, so a warning fails as well. Every rule of yamllint is
# enabled at level error; the options below are the strictest ones that agree with Prettier, which formats the
# YAML files.
ignore-from-file: .gitignore
rules:
  anchors:
    forbid-duplicated-anchors: true
    forbid-undeclared-aliases: true
    forbid-unused-anchors: true
  braces:
    # `permissions: {}` (no permission) and `workflow_dispatch: {}` are the only flow mappings.
    forbid: non-empty
    max-spaces-inside: 0
    max-spaces-inside-empty: 0
    min-spaces-inside: 0
    min-spaces-inside-empty: 0
  brackets:
    forbid: false
    max-spaces-inside: 0
    max-spaces-inside-empty: 0
    min-spaces-inside: 0
    min-spaces-inside-empty: 0
  colons:
    max-spaces-after: 1
    max-spaces-before: 0
  commas:
    max-spaces-after: 1
    max-spaces-before: 0
    min-spaces-after: 1
  comments:
    ignore-shebangs: false
    # Prettier writes one space between the content and an end-of-line comment.
    min-spaces-from-content: 1
    require-starting-space: true
  comments-indentation: enable
  document-end:
    present: false
  document-start:
    present: true
  empty-lines:
    max: 1
    max-end: 0
    max-start: 0
  empty-values:
    forbid-in-block-mappings: true
    forbid-in-block-sequences: true
    forbid-in-flow-mappings: true
  float-values:
    forbid-inf: true
    forbid-nan: true
    forbid-scientific-notation: true
    require-numeral-before-decimal: true
  hyphens:
    max-spaces-after: 1
  indentation:
    check-multi-line-strings: true
    indent-sequences: true
    spaces: 2
  key-duplicates:
    forbid-duplicated-merge-keys: true
  key-ordering: enable
  line-length:
    allow-non-breakable-inline-mappings: false
    allow-non-breakable-words: true
    max: 120
  new-line-at-end-of-file: enable
  new-lines:
    type: unix
  octal-values:
    forbid-explicit-octal: true
    forbid-implicit-octal: true
  quoted-strings:
    allow-quoted-quotes: true
    check-keys: true
    quote-type: double
    required: only-when-needed
  trailing-spaces: enable
  truthy:
    allowed-values: ["false", "true"]
    check-keys: true
